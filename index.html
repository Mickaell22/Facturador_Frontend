<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E8" />
    <script>
      // Aplica el tema antes del primer render para evitar el destello claro.
      // Las vistas publicas (/p/, /c/) son siempre claras: las abre el cliente final.
      (function () {
        if (/^\/(p|c)\//.test(location.pathname)) return
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#1A1714')
        }
      })()
    </script>
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="Resumen de pedido — %VITE_APP_TITLE%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="Resumen de pedido — %VITE_APP_TITLE%" />
    <meta property="og:site_name" content="%VITE_APP_TITLE%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="Resumen de pedido — %VITE_APP_TITLE%" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
